[package]
name = "cryptography-rs"
version = "0.7.0"
edition = "2021"
# Matches the siblings rust-mp and rng-entropy; the floor is inherited from
# rust-mp (u64/usize::is_multiple_of, stable 1.87) and verified with
# `cargo +1.87 check`.
rust-version = "1.87"
license = "BSD-2-Clause"
authors = ["Darrell Long"]
description = "Block ciphers, hashes, public-key, and post-quantum primitives implemented directly from their specifications and original papers."
repository = "https://github.com/darrelllong/cryptography"
readme = "README.md"
documentation = "https://docs.rs/cryptography-rs"
keywords = ["cryptography", "ciphers", "hash", "public-key", "post-quantum"]
categories = ["cryptography", "algorithms"]
exclude = [
    "fast/**",
    "fuzz/**",
    "benchmarks/**",
    "assets/**",
    "scripts/**",
    "target/**",
    ".claude/**",
    ".codex/**",
    "pubs/**",
    "cipher_plots/**",
    ".ntru-upstream/**",
]
autobenches = false

[lib]
name = "cryptography"
path = "src/lib.rs"

[features]
default = []
ct_profile = []
# Opt-in aarch64 FEAT_SHA3 hardware Keccak ("ARM go fast"). Uses `unsafe`
# NEON intrinsics behind runtime feature detection. The default build is
# pure safe Rust apart from the one audited volatile-zeroization helper.
arm-sha3 = []

# Benchmark targets live in the separate `benchmarks/` crate so ordinary
# `cargo test` on this package does not need to resolve benchmark-only crates.

[dependencies]
# The multiprecision layer, extracted from this crate (re-exported through
# `crate::vt`). The package is rust-mp, the lib is rump, so code says
# `use rump::...`; the path serves side-by-side checkouts and the version
# takes over once rust-mp is published. The `wipe` feature restores rump's
# drop-time limb zeroization — key material must not linger in freed heap
# memory, so this crate always enables it.
rust-mp = { version = "0.3.0", path = "../rump", features = ["wipe"] }
