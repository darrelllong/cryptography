[package]
name = "cryptography"
version = "0.2.0"
edition = "2021"
license = "BSD-2-Clause"
autobenches = false

[lib]
name = "cryptography"
path = "src/lib.rs"

[features]
default = []
ct_profile = []

# Benchmark targets live in the separate `benchmarks/` crate so ordinary
# `cargo test` on this package does not need to resolve benchmark-only crates.

[dependencies]
quick-xml = "0.38"
