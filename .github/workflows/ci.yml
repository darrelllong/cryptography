name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          # MSRV — keep in sync with rust-version in Cargo.toml.
          - os: ubuntu-latest
            rust: "1.87"
    defaults:
      run:
        working-directory: cryptography
    steps:
      # rust-mp is taken from ../rump by path (it is not on crates.io), so
      # the sibling is checked out next to this repository exactly as it
      # lives on a development machine — the same layout entropy's CI uses.
      - uses: actions/checkout@v4
        with:
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          path: rump
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt && rustup default ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cryptography
      - name: fmt
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      # Job logs need authentication to read, but annotations do not, so a
      # failure names its failing tests where anyone can see them.
      - name: Tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^test .* FAILED|panicked at" /tmp/test.log | head -20 | while read -r l; do echo "::error::$l"; done
          fi
          exit "$status"
      # The opt-in NEON Keccak path is aarch64-only and runtime-detected;
      # the macos-latest runner is Apple silicon, so the feature's unsafe
      # path actually executes there.
      - name: Tests (arm-sha3, aarch64)
        if: matrix.os == 'macos-latest'
        run: cargo test --features arm-sha3 hash::sha3
      - name: Doc build (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  # The same courtesy this crate expects of rump: a breaking push here turns
  # this CI red rather than entropy's next one. entropy builds and tests
  # against the exact cryptography commit under test.
  downstream:
    name: downstream (entropy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          path: rump
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/entropy
          path: entropy
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: entropy
      - name: entropy tests against this cryptography
        working-directory: entropy
        run: cargo test
