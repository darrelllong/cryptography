name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release-only ignored tests run weekly and on request (see the
  # release-ignored job); every other job runs on every push, PR and weekly
  # run.
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  # rust-mp is taken from ../rump by path (it is not on crates.io). This
  # crate works with the latest rump, so every job checks out rump's main;
  # rump's own CI runs this crate's tests on every rump push, and the weekly
  # run here catches a rump change between pushes to this repository.

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          # MSRV — keep in sync with rust-version in Cargo.toml.
          - os: ubuntu-latest
            rust: "1.87"
    defaults:
      run:
        working-directory: cryptography
    steps:
      # The sibling is checked out next to this repository exactly as it
      # lives on a development machine — the same layout entropy's CI uses.
      - uses: actions/checkout@v4
        with:
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          path: rump
      # The cross-check tests compare against the `openssl` tool, and with
      # CRYPTOGRAPHY_OPENSSL_REQUIRED=1 a missing tool or an algorithm it
      # lacks fails the test instead of skipping. Ubuntu's OpenSSL 3 ships
      # the legacy provider (single DES, CAST5, SEED, Blowfish); macOS gets
      # Homebrew's openssl@3 because the system binary is LibreSSL, which
      # lacks SHA-3, SHA-512/256 and SEED and names no algorithm it rejects.
      - name: Install OpenSSL 3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssl && openssl version
      - name: Install OpenSSL 3 (macOS)
        if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3; /opt/homebrew/opt/openssl@3/bin/openssl version
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt && rustup default ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cryptography
      # Each result names what it was built from: this commit, rump's
      # commit, the toolchain, the lockfile and the OpenSSL the cross-checks
      # find.
      - name: Build identity
        shell: bash
        run: |
          echo "cryptography $(git rev-parse HEAD)"
          echo "rump $(git -C ../rump rev-parse HEAD)"
          rustc -Vv
          cargo -V
          shasum -a 256 Cargo.lock
          for tool in openssl /opt/homebrew/opt/openssl@3/bin/openssl; do
            command -v "$tool" >/dev/null && echo "$tool: $("$tool" version)"
          done
          true
      - name: fmt
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      # The profiling feature is opt-in and never built by the default job;
      # this keeps it compiling under deny(missing_docs) and its tests green.
      - name: Clippy (ct_profile feature)
        run: cargo clippy --features ct_profile --all-targets -- -D warnings
      # Job logs need authentication to read, but annotations do not, so a
      # failure names its failing tests where anyone can see them.
      - name: Tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CRYPTOGRAPHY_OPENSSL_REQUIRED: "1"
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^test .* FAILED|panicked at" /tmp/test.log | head -20 | while read -r l; do echo "::error::$l"; done
          fi
          exit "$status"
      - name: Tests (ct_profile feature)
        env:
          CRYPTOGRAPHY_OPENSSL_REQUIRED: "1"
        run: cargo test --features ct_profile
      # The opt-in NEON Keccak path is aarch64-only and runtime-detected;
      # the macos-latest runner is Apple silicon, so the feature's unsafe
      # path actually executes there, under the whole suite and clippy.
      - name: Clippy (arm-sha3, aarch64)
        if: matrix.os == 'macos-latest'
        run: cargo clippy --features arm-sha3 --all-targets -- -D warnings
      - name: Tests (arm-sha3, aarch64)
        if: matrix.os == 'macos-latest'
        env:
          CRYPTOGRAPHY_OPENSSL_REQUIRED: "1"
        run: cargo test --features arm-sha3
      - name: Doc build (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  # The randomness report's decision, cache and atomic-write rules, checked
  # without cargo or the plaintext.
  report-script:
    name: randomness report self-test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R
        run: sudo apt-get update && sudo apt-get install -y r-base-core
      - name: Self-test
        run: Rscript scripts/cipher_randomness.R --self-test

  # The crates that depend on this one by path but are excluded from the
  # package: the fuzz targets, the criterion benchmarks, and the two
  # platform-intrinsics crates. Each fast crate is checked on its own
  # architecture; the intrinsics do not compile on the other.
  companions:
    name: companion crates (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fast: fast/x86/x86-alt
          - os: macos-latest
            fast: fast/Apple-Silicon/aarch64-alt
    defaults:
      run:
        working-directory: cryptography
    steps:
      - uses: actions/checkout@v4
        with:
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          path: rump
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cryptography/fuzz
            cryptography/benchmarks
            cryptography/${{ matrix.fast }}
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: Check benchmarks
        run: cargo check --manifest-path benchmarks/Cargo.toml --all-targets
      - name: Check ${{ matrix.fast }}
        run: cargo check --manifest-path ${{ matrix.fast }}/Cargo.toml --all-targets

  # The same courtesy this crate expects of rump: a breaking push here turns
  # this CI red rather than entropy's next one. entropy builds and tests
  # against the exact cryptography commit under test, which its manifest
  # must reach by the sibling path; a registry version there would test a
  # published crate instead, so the step checks the manifest first.
  downstream:
    name: downstream (entropy)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          path: rump
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/entropy
          path: entropy
      - name: entropy takes cryptography from the sibling path
        working-directory: entropy
        run: |
          grep -E '^cryptography-rs *= *\{.*path *= *"\.\./cryptography"' Cargo.toml \
            || { echo "::error::entropy/Cargo.toml does not take cryptography-rs from path = \"../cryptography\""; exit 1; }
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: entropy
      - name: entropy tests against this cryptography
        working-directory: entropy
        run: cargo test
      # entropy without its default features has no dependencies at all, so
      # this catches anything that leaks the cryptography or FFT paths into
      # entropy's core.
      - name: entropy without default features
        working-directory: entropy
        run: cargo test --no-default-features

  # The twelve release-only tests (million-iteration RFC 7748 ladders, every
  # CAVP prime-generation case, FIPS parameter generation at every approved
  # size, the full NTRU KATs). They take about 8 minutes on a 128-core host,
  # where each runs on its own core; a 4-core runner shares the cores among
  # them, so expect roughly 30 to 45 minutes there, the compile included.
  # Runs weekly and on request, never on a push.
  release-ignored:
    name: release-only ignored tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: cryptography
    steps:
      - uses: actions/checkout@v4
        with:
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          path: rump
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cryptography
      # Each result names what it was built from: this commit, rump's
      # commit, the toolchain, the lockfile and the OpenSSL the cross-checks
      # find.
      - name: Build identity
        shell: bash
        run: |
          echo "cryptography $(git rev-parse HEAD)"
          echo "rump $(git -C ../rump rev-parse HEAD)"
          rustc -Vv
          cargo -V
          shasum -a 256 Cargo.lock
          for tool in openssl /opt/homebrew/opt/openssl@3/bin/openssl; do
            command -v "$tool" >/dev/null && echo "$tool: $("$tool" version)"
          done
          true
      - name: Ignored tests (release)
        run: cargo test --release -- --ignored
