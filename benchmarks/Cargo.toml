[package]
name = "cryptography-benchmarks"
version = "0.2.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bench]]
name = "aes_bench"
harness = false

[[bench]]
name = "cipher_bench"
harness = false

[[bench]]
name = "drbg_bench"
harness = false

[[bench]]
name = "keystream_sizes"
harness = false

[features]
# The libsodium comparison in aes_bench. Off by default so the benchmarks
# build and run on a machine without libsodium.
libsodium = ["dep:sodiumoxide"]

[dependencies]
cryptography = { package = "cryptography-rs", path = ".." }
sodiumoxide = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
